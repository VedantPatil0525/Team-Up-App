<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="220" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0d1326" />
      <stop offset="100%" stop-color="#0a0e1c" />
    </linearGradient>

    <!-- Neon Horizon Gradient with Animation -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#8b5cf6;#06b6d4;#3b82f6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#06b6d4;#3b82f6;#8b5cf6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#3b82f6;#8b5cf6;#06b6d4" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.35" />
    </linearGradient>

    <!-- Second Wave Gradient -->
    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes floatWave1 {
      0% { transform: translateX(0px); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0px); }
    }
    @keyframes floatWave2 {
      0% { transform: translateX(0px); }
      50% { transform: translateX(40px); }
      100% { transform: translateX(0px); }
    }
    @keyframes pulseNode {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 0.9; transform: scale(1.15); }
    }
    @keyframes pulseBadge {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.7)); }
    }
    .wave1 {
      animation: floatWave1 12s ease-in-out infinite;
    }
    .wave2 {
      animation: floatWave2 16s ease-in-out infinite;
    }
    .node-pulse {
      animation: pulseNode 3s ease-in-out infinite;
      transform-origin: center;
    }
    .badge-glow {
      animation: pulseBadge 4s ease-in-out infinite;
    }
  </style>

  <!-- Container Box with Rounded Borders -->
  <rect x="2" y="2" width="1196" height="216" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Animated Cyber Mesh Grid Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.75">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="150" y1="0" x2="150" y2="220" />
    <line x1="300" y1="0" x2="300" y2="220" />
    <line x1="450" y1="0" x2="450" y2="220" />
    <line x1="600" y1="0" x2="600" y2="220" />
    <line x1="750" y1="0" x2="750" y2="220" />
    <line x1="900" y1="0" x2="900" y2="220" />
    <line x1="1050" y1="0" x2="1050" y2="220" />
  </g>

  <!-- Animated Ambient Sine Wave 2 (Deeper layer) -->
  <g class="wave2">
    <path d="M-100,140 Q 200,60 500,130 T 1100,120 T 1400,150 L 1400,220 L -100,220 Z" fill="url(#waveGrad2)" opacity="0.4" />
  </g>

  <!-- Animated Neon Sine Wave 1 (Foreground layer) -->
  <g class="wave1">
    <path d="M-100,160 Q 250,80 600,140 T 1300,130 L 1300,220 L -100,220 Z" fill="url(#waveGrad)" opacity="0.5" />
    <path d="M-100,160 Q 250,80 600,140 T 1300,130" fill="none" stroke="url(#neonGlow)" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="1200,0;0,1200;1200,0" dur="15s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Glowing Animated Circuit Nodes -->
  <g fill="#38bdf8" filter="url(#glow)">
    <circle cx="250" cy="115" r="4" class="node-pulse" style="animation-delay: 0s;" />
    <circle cx="480" cy="142" r="3.5" class="node-pulse" style="animation-delay: 0.8s;" />
    <circle cx="720" cy="128" r="4.5" class="node-pulse" style="animation-delay: 1.5s;" />
    <circle cx="950" cy="105" r="4" class="node-pulse" style="animation-delay: 2.2s;" />
  </g>

  <!-- Top Glowing Horizon Line -->
  <line x1="16" y1="3" x2="1184" y2="3" stroke="url(#neonGlow)" stroke-width="2.5" filter="url(#glow)" />

  <!-- Center Identity Branding -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <!-- Hexagonal Icon Badge -->
    <g transform="translate(-18, -48)" class="badge-glow">
      <polygon points="18,2 34,11 34,29 18,38 2,29 2,11" fill="rgba(139, 92, 246, 0.2)" stroke="#a855f7" stroke-width="1.8" filter="url(#glow)" />
      <path d="M11,15 L18,25 L25,15" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="18" cy="14" r="2.5" fill="#a855f7" />
    </g>

    <!-- Main Title -->
    <text y="14" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="3">
      TEAM-UP
    </text>

    <!-- Subtitle / Architecture Tokens -->
    <text y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">
      OPERATIONAL COORDINATION ENGINE • ATOMIC OCC • SERVER-ENFORCED RBAC
    </text>

    <!-- Status Indicator Pill -->
    <g transform="translate(0, 64)">
      <rect x="-140" y="-12" width="280" height="24" rx="12" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
      <circle cx="-115" cy="0" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="5" y="4" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.8">
        ALL SYSTEMS OPERATIONAL
      </text>
    </g>
  </g>

  <!-- Left Accent Tech Bracket -->
  <g opacity="0.3" stroke="#64748b" stroke-width="1.5" fill="none">
    <path d="M40,70 L25,70 L25,150 L40,150" />
    <text x="35" y="114" fill="#64748b" font-family="monospace" font-size="10" transform="rotate(-90 35,114)">ACID • OCC</text>
  </g>

  <!-- Right Accent Tech Bracket -->
  <g opacity="0.3" stroke="#64748b" stroke-width="1.5" fill="none">
    <path d="M1160,70 L1175,70 L1175,150 L1160,150" />
    <text x="1165" y="114" fill="#64748b" font-family="monospace" font-size="10" transform="rotate(90 1165,114)">FASTAPI • V1</text>
  </g>
</svg>
